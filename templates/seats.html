<!DOCTYPE html>
<html>
<head>
    <title>Select Seats</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .navbar {
            background-color: #e71a0f;
            padding: 15px;
            color: white;
            font-weight: 600;
        }

        .seat {
            width: 35px;
            height: 35px;
            margin: 5px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .available {
            background-color: #90ee90;
        }

        .booked {
            background-color: #ff4d4d;
            cursor: not-allowed;
        }

        .selected {
            background-color: #4da6ff;
        }

        .row {
            margin: 10px 0;
        }

        .screen {
            margin: 20px;
            padding: 10px;
            background: #ccc;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="navbar">
    🎬 Select Your Seats
</div>

<div class="screen">SCREEN THIS WAY</div>

<form method="POST" action="/book_seats">

{% for r in rows %}
    <div class="row">
        <strong>{{ r[0] }}</strong>

        {% for s in seats %}
            {% if (r[0], s[0]) in booked %}
                <button class="seat booked" disabled></button>
            {% else %}
                <button type="button" class="seat available"
                        onclick="toggleSeat(this, '{{r[0]}}-{{s[0]}}')"></button>
            {% endif %}
        {% endfor %}
    </div>
{% endfor %}

<input type="hidden" name="selected_seats" id="selectedSeats">

<br><br>

<button type="submit">Proceed →</button>

</form>

<script>
    let selected = [];

    function toggleSeat(btn, value) {
        if (btn.classList.contains("selected")) {
            btn.classList.remove("selected");
            selected = selected.filter(v => v !== value);
        } else {
            btn.classList.add("selected");
            selected.push(value);
        }

        document.getElementById("selectedSeats").value = selected.join(",");
    }
</script>

</body>
</html>
