<!DOCTYPE html>
<html>
<head>
    <title>Movie Booking</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: url('https://images.unsplash.com/photo-1524985069026-dd778a71c7b4') no-repeat center center/cover;
            height: 100vh;
        }

        .overlay {
            background: rgba(0,0,0,0.7);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            padding: 20px;
            color: white;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
        }

        .hero {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            color: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        .btn {
            background: linear-gradient(90deg, #e71a0f, #ff4b2b);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .tagline {
            text-align: center;
            color: #ddd;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="overlay">

    <div class="navbar">
        🎬 Movie Booking Experience
    </div>

    <div class="hero">

        <div class="form-box">

            <h2>Book Your Show</h2>
            <div class="tagline">Skip the queue. Book instantly.</div>

            <form method="POST">

                <input type="text" name="name" placeholder="Enter your name" required>

                <input type="text" name="phone" placeholder="Enter phone number" required>

                <select name="city">
                    <option>CHENNAI</option>
                    <option>BENGALURU</option>
                    <option>MUMBAI</option>
                    <option>DELHI</option>
                    <option>KOLKATA</option>
                </select>

                <button class="btn">Start Booking →</button>

            </form>

        </div>

    </div>

</div>

</body>
</html>>
