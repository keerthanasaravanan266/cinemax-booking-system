<!DOCTYPE html>
<html>
<head>
    <title>Snacks</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background-color: #e71a0f;
            padding: 15px;
            color: white;
            font-weight: 600;
            text-align: center;
            font-size: 20px;
        }

        .container {
            padding: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        input {
            width: 60px;
            padding: 5px;
            margin-top: 10px;
            text-align: center;
        }

        .btn {
            background-color: #e71a0f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 30px;
        }

        .btn:hover {
            background-color: #c9140c;
        }
    </style>
</head>

<body>

<div class="navbar">
    🍿 Choose Your Snacks
</div>

<form method="POST" action="/add_snacks">

<div class="container">

    <div class="grid">

        {% for s in snacks %}
        <div class="card">
            <h3>{{ s[1] }}</h3>
            <p>₹{{ s[2] }}</p>

            <label>Qty:</label><br>
            <input type="number" name="{{ s[0] }}" min="0" value="0">
        </div>
        {% endfor %}

    </div>

    <div style="text-align:center;">
        <button type="submit" class="btn">
            Proceed to Payment →
        </button>
    </div>

</div>

</form>

</body>
</html>
