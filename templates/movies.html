<!DOCTYPE html>
<html>
<head>
    <title>Movies</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
        }

        .navbar {
            background: linear-gradient(90deg, #e71a0f, #ff4b2b);
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
        }

        .container {
            padding: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 25px;
        }

        .movie-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.4s;
        }

        .movie-card:hover {
            transform: scale(1.08);
        }

        .movie-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
        }

        .movie-title {
            font-size: 16px;
            font-weight: 600;
        }

        .rating {
            font-size: 13px;
            color: #facc15;
        }

        .btn-book {
            margin-top: 10px;
            background: #e71a0f;
            border: none;
            padding: 8px;
            border-radius: 8px;
            color: white;
            width: 100%;
            transition: 0.3s;
        }

        .btn-book:hover {
            background: #ff4b2b;
        }
    </style>
</head>

<body>

<div class="navbar">
    🎬 Now Showing
</div>

<div class="container">

    <div class="grid">

        {% for m in movies %}
        <div class="movie-card">

            <img src="{{ url_for('static', filename='images/' + m[1] + '.jpg') }}"
                 onerror="this.src='https://via.placeholder.com/300x450'"
                 class="movie-img">

            <div class="overlay">
                <div class="movie-title">{{ m[1] }}</div>

                <div class="rating">⭐ {{ m[6] }} | Action/Drama</div>

                <form method="POST" action="/select_movie">
                    <input type="hidden" name="movie" value="{{ m[1] }}">
                    <input type="hidden" name="screen" value="{{ m[5] }}">
                    <input type="hidden" name="date" value="2026-03-10">

                    <button class="btn-book">Book Now</button>
                </form>
            </div>

        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
