<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .box {
            background: white;
            padding: 30px;
            margin: 100px auto;
            width: 400px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .btn {
            background-color: #e71a0f;
            color: white;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>💳 Payment</h2>

    <h3>Total: ₹{{ total }}</h3>

    <form method="POST">
        <select name="method">
            <option>UPI</option>
            <option>Card</option>
            <option>Net Banking</option>
        </select>

        <br>
        <button class="btn">Pay Now</button>
    </form>
</div>

</body>
</html>
