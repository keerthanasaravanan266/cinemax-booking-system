<!DOCTYPE html>
<html>
<head>
    <title>Select Theatre</title>

    <style>
        body {
            font-family: Poppins;
            background: #f5f5f5;
            text-align: center;
        }

        .box {
            margin: 50px auto;
            width: 400px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .card:hover {
            background: #e71a0f;
            color: white;
        }
    </style>
</head>

<body>

<h2>Select Theatre</h2>

<form method="POST" action="/select_theatre">

{% for t in data[0][1:] %}
    <button class="card" name="theatre" value="{{ t }}">
        {{ t }}
    </button>
{% endfor %}

</form>

</body>
</html>
